import org.gradle.api.attributes.java.TargetJvmVersion

plugins {
    id 'com.gradleup.shadow' version '8.3.9'
}

apply plugin: 'java'
group 'github.saukiya'
version '3.9.3'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile) {
    // JDK 23+ 默认不再运行注解处理器, 显式开启以保证 Lombok 生效; -Xlint:-options 压掉 target 8 的过时警告
    options.compilerArgs += ["-Xlint:-options", "-proc:full"]
    options.encoding = "UTF-8"
}

repositories {
    mavenLocal()
    mavenCentral()

    // Minecraft Api
    maven { url 'https://libraries.minecraft.net' }
    // MythicMobs
    maven { url "https://mvn.lumine.io/repository/maven-public/" }
    // bStats-bukkit
    maven { url "https://repo.codemc.io/repository/maven-public" }
    // CraftBukkit
    maven { url 'https://repo.codemc.io/repository/nms/' }
    // Folia API
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    // Github Project
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'org.bstats:bstats-bukkit:2.2.1'
    compileOnly fileTree('lib')

    // Folia API must precede the legacy Spigot server jar so its scheduler methods are visible to javac.
    compileOnly('dev.folia:folia-api:1.20.6-R0.1-SNAPSHOT') {
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
        }
    }
    compileOnly 'org.spigotmc:spigot:1.17.1-R0.1-SNAPSHOT'
    compileOnly 'io.lumine.xikage:MythicMobs:4.9.1'
    compileOnly 'io.lumine:Mythic-Dist:5.2.1'
    compileOnly 'com.gmail.filoghost.holographicdisplays:holographicdisplays-api:2.4.9'
    // 仅需编译期的 DHAPI/Hologram API 类, 运行时由服务器实际安装的 DecentHolograms 提供(API 向后兼容);
    // 选用 2.8.6 单体 jar: 含完整 api 包且未声明 JDK 变体, 规避新版聚合坐标 nms-* 子模块要求高版本 JDK 的解析冲突
    compileOnly('com.github.decentsoftware-eu:decentholograms:2.8.6') { transitive = false }
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
}

shadowJar {
    // 过滤未使用的依赖
    minimize()
    // bStats重定向
    relocate('org.bstats', 'github.saukiya.sxattribute.bstats')
}

tasks.build.finalizedBy shadowJar
//gradle 需要对文件中含有的'$'进行转义: $ -> \$
processResources.expand(version: version)
tasks.build.finalizedBy shadowJar
buildCopyTask('buildLatestJar', "$rootDir\\build", "Latest")

assemble.group = buildDependents.group = buildNeeded.group = jar.group = classes.group = testClasses.group = "build other"

def buildCopyTask(String taskName, String destinationDir, String jarSuffix) {
    tasks.register(taskName, Copy) {
        group = "build"
        dependsOn shadowJar
        from shadowJar.archiveFile.get().asFile.path
        into(destinationDir).rename { "${project.name}-${jarSuffix}.jar" }
        doLast {
            println "OutputPath: " + destinationDir
        }
    }
}
