# 是否启用装备强化功能；关闭后不会在锻造界面注册该操作。
Enable: true
# 装备允许达到的最高强化等级。
MaxLevel: 20
# 强化过程使用的动态公式，<l:level> 表示操作前的强化等级。
Formula:
  # 成功率百分比；结果会按 0 到 100 的概率处理。
  SuccessChance: "<c:100 - <l:level> * 3>"
# 强化失败后的处理规则。
Failure:
  # 可选 KEEP、DOWNGRADE、RESET、DESTROY，分别表示保留、降级、清零或销毁装备。
  Policy: DOWNGRADE
  # Policy 为 DOWNGRADE 时降低的等级数。
  Levels: 1
  # 失败后免除惩罚的概率公式，结果按百分比处理。
  ProtectionChance: "<c:0>"
# 强化状态写入装备 Lore 时使用的显示模板。
Lore:
  # {level} 会替换为当前强化等级。
  Level: "&a强化等级: +{level}"
  # {name} 与 {value} 分别替换为属性显示名和公式计算值。
  Attribute: "&7{name}: {value}"
# 强化等级提供的属性；子节点名是内部属性 ID。
Attributes:
  Damage:
    # 属性在 Lore 中显示的名称。
    Name: 攻击力
    # 当前等级对应的属性值公式。
    Formula: "<c:<l:level> * 2>"
# 每次强化尝试都会预扣的资源，事务失败时会自动返还。
Cost:
  Money: 200
  Experience: 0
  Levels: 0
  Items:
    # Bukkit 材质名与扣除数量共同定义一种物品成本。
    - Material: IRON_INGOT
      Amount: 1
