  # 点燃。按几率(减目标韧性)触发, 使目标着火一段时间。
  # Formula.Chance   变量: <l:value>=点燃几率, <l:toughness>=目标韧性   结果: 判定几率(%)
  # Formula.Ignition 结果: 点燃持续时间(单位 tick, 20tick=1秒; 默认 40 + 随机0~59 tick)
  Ignition:
    Enable: true
    Formula:
      Chance: "<c:<l:value> - <l:toughness>>"
      Ignition: "<c:40 + <i:0_59>>"
    Message:
      Enable: true
      Holo: "&c&o点燃: &b&o{0}s"
      Battle: "[ACTIONBAR]&c{0}&6 被 &c{1}&6 点燃了!"
    Ignition:
      DiscernName: 点燃几率
      CombatPower: 1
      UpperLimit: 100
    Display:
      Category: ATTACK
      Order: 6
      Rows:
        - placeholder: Ignition
          label: 点燃几率
          color: "&c"
          suffix: "%"

  # 雷霆。按几率(减目标韧性)触发, 召唤闪电并按目标当前生命造成伤害。
  # Formula.Chance    变量: <l:value>=雷霆几率, <l:toughness>=目标韧性   结果: 判定几率(%)
  # Formula.Lightning 变量: <l:health>=目标当前生命   结果: 雷击造成的伤害值(默认 生命*随机0~1/10)
  Lightning:
    Enable: true
    Formula:
      Chance: "<c:<l:value> - <l:toughness>>"
      Lightning: "<c:<l:health> * <d:0_1> / 10>"
    Message:
      Enable: true
      Holo: "&e&o雷霆: &b&o{0}"
      Battle: "[ACTIONBAR]&c{0}&6 被 &c{1}&6 用雷电击中了!"
    Lightning:
      DiscernName: 雷霆几率
      CombatPower: 1
      UpperLimit: 100
    Display:
      Category: ATTACK
      Order: 7
      Rows:
        - placeholder: Lightning
          label: 雷霆几率
          color: "&e"
          suffix: "%"

  # 撕裂。按几率(减目标韧性)触发, 持续多跳按目标生命扣血(真实伤害)。
  # Formula.Chance  变量: <l:value>=撕裂几率, <l:toughness>=目标韧性   结果: 判定几率(%)
  # Formula.Tearing 变量: <l:health>=目标当前生命   结果: 每跳撕裂伤害(默认 生命/100)
  Tearing:
    Enable: true
    Formula:
      Chance: "<c:<l:value> - <l:toughness>>"
      Tearing: "<c:<l:health> / 100>"
    Message:
      Enable: true
      Holo: "&c&o撕裂: &b{0}"
      Battle: "[ACTIONBAR]&c{0}&6 被 &c{1}&6 撕裂了!"
    Tearing:
      DiscernName: 撕裂几率
      CombatPower: 1
      UpperLimit: 100
    Display:
      Category: ATTACK
      Order: 8
      Rows:
        - placeholder: Tearing
          label: 撕裂几率
          color: "&c"
          suffix: "%"

  # 药水攻击。命中时对每种配置的药水效果按几率(减目标韧性)施加。效果列表 List.* 由代码缺省在内存补齐,
  # 如需增删药水种类/等级/时长, 在本节点补写 List.<名>.{Type,DiscernName,CombatPower,MinLevel,MaxLevel,MinTime,MaxTime} 即可。
  # Formula.Chance 变量: <l:value>=该效果几率, <l:toughness>=目标韧性   结果: 该效果判定几率(%)
  AttackPotion:
    Enable: true
    NetworkLink: "https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/potion/PotionEffectType.html"
    Formula:
      Chance: "<c:<l:value> - <l:toughness>>"
    Message:
      Enable: true
      Holo: "&o{0}: &b&o{1}s"
      Battle: "[ACTIONBAR]&c{0}&6 对 &c{1}&6 造成了 &r{2}&6 效果!"
    List:
      Blindness:
        Type: BLINDNESS
        DiscernName: 致盲几率
        CombatPower: 1
        MessageName: "&7致盲&7"
        MinLevel: 1
        MaxLevel: 2
        MinTime: 2
        MaxTime: 5
      Wither:
        Type: WITHER
        DiscernName: 凋零几率
        CombatPower: 1
        MessageName: "&9凋零&7"
        MinLevel: 1
        MaxLevel: 2
        MinTime: 2
        MaxTime: 5
      Slow:
        Type: SLOW
        DiscernName: 减速几率
        CombatPower: 1
        MessageName: "&3减速&7"
        MinLevel: 1
        MaxLevel: 2
        MinTime: 2
        MaxTime: 5
      Poison:
        Type: POISON
        DiscernName: 中毒几率
        CombatPower: 1
        MessageName: "&d中毒&7"
        MinLevel: 1
        MaxLevel: 2
        MinTime: 2
        MaxTime: 5
      Hunger1:
        Type: HUNGER
        DiscernName: 夺食几率
        CombatPower: 1
        UpperLimit: 50
        MessageName: "&c饥饿&7"
        MinLevel: 4
        MaxLevel: 5
        MinTime: 2
        MaxTime: 5

  # 防御力(区间减伤)。攻击者破甲(Real)时本次不生效。
  # Formula 变量: <l:min>=词条最小防御  <l:max>=词条最大防御
  # Formula 结果 : 本次减免的伤害值(默认在 min~max 间均匀随机)
  Defense:
    Enable: true
    Formula: "<c:<l:min> + <d:0_1> * (<l:max> - <l:min>)>"
    Defense:
      DiscernName: 防御力
      CombatPower: 1
    PVPDefense:
      DiscernName: PVP防御力
      CombatPower: 1
    PVEDefense:
      DiscernName: PVE防御力
      CombatPower: 1
    Display:
      Category: DEFENSE
      Order: 1
      Rows:
        - placeholder: Defense
          label: 防御力
          color: "&6"
        - placeholder: PvpDefense
          label: PVP防御力
          color: "&6"
        - placeholder: PveDefense
          label: PVE防御力
          color: "&6"

  # 生命上限。UPDATE 型, 设置玩家最大生命值。
  # Formula 变量: <l:value>=生命上限词条, <l:skillapi>=SkillAPI 职业附加生命
  # Formula 结果 : SX 自身最大生命；以固定加成写入原版 max_health，并保留 AuraSkills 等外部插件的基础值和修饰符
  Health:
    Enable: true
    Formula: "<c:<l:value> + <l:skillapi>>"
    Health:
      DiscernName: 生命上限
      CombatPower: 1
    HealthScaled:
      Enabled: true
      Value: 40
    Display:
      Category: DEFENSE
      Order: 2
      Rows:
        - line: "&a生命上限:&b %sx_Health%/%sx_MaxHealth%"

  # 生命恢复。每秒(20tick)自动回复生命。
  # Formula 变量: <l:value>=生命恢复词条
  # Formula 结果 : 每秒回复的生命值
  HealthRegen:
    Enable: true
    Formula: "<c:<l:value>>"
    Health:
      DiscernName: 生命恢复
      CombatPower: 1
    HealthScaled:
      Enabled: true
      Value: 40
    Display:
      Category: DEFENSE
      Order: 3
      Rows:
        - placeholder: HealthRegen
          label: 生命恢复
          color: "&a"

  # 闪避。受击时按几率(减攻击者命中)完全免除本次伤害并击退自身。
  # Formula.Chance 变量: <l:value>=闪避几率, <l:hitrate>=攻击者命中   结果: 判定几率(%)
  Dodge:
    Enable: true
    Formula:
      Chance: "<c:<l:value> - <l:hitrate>>"
    Message:
      Enable: true
      Holo: "&a&o闪避"
      Battle: "[ACTIONBAR]&c{0}&6 躲开了 &c{1}&6 的攻击!"
    Dodge:
      DiscernName: 格挡几率
      CombatPower: 1
      UpperLimit: 100
    Display:
      Category: DEFENSE
      Order: 4
      Rows:
        - placeholder: Dodge
          label: 闪避几率
          color: "&d"
          suffix: "%"

  # 韧性。被动数值, 被 点燃/雷霆/撕裂/药水 触发型攻击读取以降低其触发几率(读取的是"生效值"=本属性 Formula 结果)。
  # Formula 变量: <l:value>=韧性词条值   结果: 生效韧性(在其它属性的 <l:toughness> 中被减去; 默认恒等, 可改为递减/封顶等)
  Toughness:
    Enable: true
    Formula: "<c:<l:value>>"
    Toughness:
      DiscernName: 韧性
      CombatPower: 1
      UpperLimit: 80
    Display:
      Category: DEFENSE
      Order: 5
      Rows:
        - placeholder: Toughness
          label: 韧性
          color: "&9"
          suffix: "%"

  # 反射(反伤)。受击时按几率触发, 将伤害的比例反弹给攻击者。
  # Formula.ReflectionRate 变量: <l:value>=反射几率(%)   结果: 判定几率(%)
  # Formula.Reflection     变量: <l:damage>=当前伤害, <l:ratio>=反射比例(%)   结果: 反弹给攻击者的伤害
  Reflection:
    Enable: true
    Formula:
      ReflectionRate: "<c:<l:value>>"
      Reflection: "<c:<l:damage> * <l:ratio> / 100>"
    Message:
      Enable: true
      Holo: "&6&o反伤: &b&o{0}"
      Battle: "[ACTIONBAR]&c{0}&6 被 &c{1}&6 反弹伤害了!"
    ReflectionRate:
      DiscernName: 反射几率
      CombatPower: 1
      UpperLimit: 80
    Reflection:
      DiscernName: 反射比例
      CombatPower: 1
      UpperLimit: 100
    Display:
      Category: DEFENSE
      Order: 6
      Rows:
        - placeholder: ReflectionRate
          label: 反射几率
          color: "&c"
          suffix: "%"
        - placeholder: Reflection
          label: 反射比例
          color: "&c"
          suffix: "%"

  # 格挡。受击时按几率触发, 减免伤害的一定比例。
  # Formula.BlockRate 变量: <l:value>=格挡几率(%)   结果: 判定几率(%)
  # Formula.Block     变量: <l:damage>=当前伤害, <l:ratio>=格挡比例(%)   结果: 格挡减免的伤害
  Block:
    Enable: true
    Formula:
      BlockRate: "<c:<l:value>>"
      Block: "<c:<l:damage> * <l:ratio> / 100>"
    Message:
      Enable: true
      Holo: "&2&o格挡: &b&o{0}"
      Battle: "[ACTIONBAR]&c{0}&6 格挡了 &c{1}&6 的部分伤害!"
    BlockRate:
      DiscernName: 格挡几率
      CombatPower: 1
      UpperLimit: 100
    Block:
      DiscernName: 格挡比例
      CombatPower: 1
      UpperLimit: 100
    Display:
      Category: DEFENSE
      Order: 7
      Rows:
        - placeholder: BlockRate
          label: 格挡几率
          color: "&2"
          suffix: "%"
        - placeholder: Block
          label: 格挡比例
          color: "&2"
          suffix: "%"

  # 移速增幅(旧版实现, 直接 setWalkSpeed)。
  # Formula 变量: <l:default>=基础移速(0.2), <l:value>=移速增幅(%)
  # Formula 结果 : 最终移动速度(Bukkit 上限约 1.0)
  WalkSpeed:
    Enable: true
    Formula: "<c:<l:default> * (100 + <l:value>) / 100>"
    WalkSpeed:
      DiscernName: 移速增幅
      Default: 0.2
      UpperLimit: 400
      CombatPower: 1
    Display:
      Category: MOVEMENT
      Order: 1
      Rows:
        - placeholder: WalkSpeed
          label: 移速增幅
          color: "&b"
          suffix: "%"

  # 经验增幅。获得经验时按比例增加。
  # Formula 变量: <l:amount>=原始经验, <l:value>=经验增幅(%)
  # Formula 结果 : 最终获得的经验值
  ExpAddition:
    Enable: true
    Formula: "<c:<l:amount> * (100 + <l:value>) / 100>"
    Message: "&7你的经验增加了 &6{0}&7! [&a+{1}%&7]"
    ExpAddition:
      DiscernName: 经验增幅
      CombatPower: 1
    Display:
      Category: OTHER
      Order: 1
      Rows:
        - placeholder: ExpAddition
          label: 经验增幅
          color: "&e"
          suffix: "%"

  # 攻速增幅。UPDATE 型, 设置玩家攻击速度属性。
  # Formula 变量: <l:default>=基础攻速(3.5), <l:value>=攻速增幅(%)
  # Formula 结果 : 施加到原版 attack_speed 的最终基值
  AttackSpeed:
    Enable: true
    Formula: "<c:<l:default> * (100 + <l:value>) / 100>"
    AttackSpeed:
      DiscernName: 攻速增幅
      Default: 3.5
      CombatPower: 1
    SupportIGList:
      - SX
    ItemDefaultSpeed:
      DIAMOND_HOE: 4
      IRON_HOE: 3
      STONE_HOE: 2
      DIAMOND_SWORD: 1.6
      IRON_SWORD: 1.6
      GOLD_SWORD: 1.6
      STONE_SWORD: 1.6
      WOOD_SWORD: 1.6
      DIAMOND_PICKAXE: 1.2
      IRON_PICKAXE: 1.2
      GOLD_PICKAXE: 1.2
      STONE_PICKAXE: 1.2
      WOOD_PICKAXE: 1.2
      DIAMOND_SPADE: 1
      IRON_SPADE: 1
      GOLD_SPADE: 1
      STONE_SPADE: 1
      WOOD_SPADE: 1
      DIAMOND_AXE: 1
      GOLD_AXE: 1
      WOOD_HOE: 1
      GOLD_HOE: 1
      IRON_AXE: 0.9
      STONE_AXE: 0.8
      WOOD_AXE: 0.8
    Display:
      Category: OTHER
      Order: 2
      Rows:
        - placeholder: AttackSpeed
          label: 攻速增幅
          color: "&b"
          suffix: "%"

  # 战斗信息浮空显示管理器。无数值/无 Formula, 仅可整体开关。
  EventMessage:
    Enable: true

  # 指令属性。按物品词条触发控制台指令(List.<Tick>.* 由代码缺省在内存补齐, 可在此节点补写覆盖)。无 Formula。
  Command:
    Enable: true
    List:
      Tick1:
        DiscernName: 驾驭飞行
        Enabled:
          - "fly %player% on"
        Disable:
          - "fly %player% off"
        Continued:
          - "particle smoke %player_x% %player_y% %player_z% 0.5 0.5 0.5 0 20 normal %player%"
      Tick2:
        DiscernName: 速度 II
        Enabled:
          - "effect %player% minecraft:speed 5 1"
        Disable:
          - "effect %player% minecraft:speed 0 0"
        Continued:
          - "delay 40"
          - "effect %player% minecraft:speed 5 1"
        CombatPower: 20
