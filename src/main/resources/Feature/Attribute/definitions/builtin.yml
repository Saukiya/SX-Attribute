# ############################################################################
# SX-Attribute 内置属性定义分片。
# ----------------------------------------------------------------------------
# · 一个属性一个节点; DiscernName = 玩家物品 Lore 里书写的识别名(词条前缀)。
# · 公式引擎: 需安装 SX-Item; 未安装时忽略 Formula, 回退 Mode 预设(PERCENT/ADD/RATIO)。
# · 公式语法(SX-Item): 外层 <c: 数学式> 求值; 变量用 <l:名> 引用; 支持 %PlaceholderAPI%。
#   随机: <d:a_b> 取[a,b]随机小数, <i:a_b> 取[a,b]随机整数。
# · 通用公式变量:
#     <l:value>   = 玩家物品词条上该属性的累加数值
#     <l:default> = 该属性的默认基值(见各节点 Default / 原版默认)
#     <l:base>    = 施加前实体当前的属性基值
#     <l:min> / <l:max> = 数值下限 / 上限
#   (战斗类另有 damage/ratio/toughness/health/hitrate/amount/skillapi 等专用变量, 见各节点说明)
# · 战斗类的 DiscernName/CombatPower/UpperLimit/Message/List 等缺省值由代码在内存补齐,
#   本文件不自动写回(以保留注释)。如需改这些值, 在对应节点手动补写该键即可覆盖。
# ############################################################################

Settings:
  # 是否启用 SX-Item 公式引擎(关闭则所有 Formula 失效, 全部回退 Mode 预设)
  FormulaEngine: true
  # /stats 面板是否由本文件 Display 自动生成(关闭则回退 Message.yml 手写 lore)
  AutoPanel: true

Attributes:

