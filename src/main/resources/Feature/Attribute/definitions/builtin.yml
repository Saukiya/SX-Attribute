  # ─── 攻击距离 (entity_interaction_range) ─────────────────────────────────────────
  #  原版效果 : 玩家与实体的交互/攻击可达距离(方块), 原版默认3
  #  增幅模式 : ADD  (玩家词条填绝对量)
  #  版本要求 : 1.20.5 及以上才注册(低版本自动跳过)
  #  公式变量 : <l:value>=词条增幅  <l:default>=默认基值(3.0)  <l:base>=当前基值  <l:min>/<l:max>=限幅
  #  公式结果 : 施加到原版属性的最终基值 = 默认基值 + 增幅
  AttackRange:
    DiscernName: 攻击距离
    Enable: true
    Type:
      - UPDATE
    RegistryKey: entity_interaction_range
    LegacyName: PLAYER_ENTITY_INTERACTION_RANGE
    Version: "1.20.5"
    Default: 3.0
    Min: -100
    Max: 2147483647
    Mode: ADD
    Formula: "<c:<l:default> + <l:value>>"
    CombatPower: 0
    Display:
      Category: ATTACK
      Order: 20
      Rows:
        - placeholder: AttackRange
          label: 攻击距离
          color: "&c"

