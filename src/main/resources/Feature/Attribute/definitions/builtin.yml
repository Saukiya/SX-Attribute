  # ===================== 战斗类/其余属性(效果逻辑在 Java, 公式可调核心数学) =====================
  # 近战/远程附加伤害(区间)。参与伤害事件, 效果逻辑在 Java, 仅公式可调掷点。
  # Formula 变量: <l:min>=词条最小伤害  <l:max>=词条最大伤害
  # Formula 结果 : 本次攻击附加的伤害值(默认在 min~max 间均匀随机, 用 <d:0_1> 实现)
  Damage:
    Enable: true
    Formula: "<c:<l:min> + <d:0_1> * (<l:max> - <l:min>)>"
    Message:
      Enable: true
      Holo: "&c&o伤害: &b&o{0}"
    Damage:
      DiscernName: 攻击力
      CombatPower: 1
    PVPDamage:
      DiscernName: PVP攻击力
      CombatPower: 1
    PVEDamage:
      DiscernName: PVE攻击力
      CombatPower: 1
    Display:
      Category: ATTACK
      Order: 1
      Rows:
        - placeholder: Damage
          label: 攻击力
          color: "&c"
        - placeholder: PvpDamage
          label: PVP攻击力
          color: "&c"
        - placeholder: PveDamage
          label: PVE攻击力
          color: "&c"

